packages:
  - .
  - cloudflare

minimumReleaseAge: 10080
blockExoticSubdeps: true

onlyBuiltDependencies:
  - esbuild
  - sharp

overrides:
  vite: 8.2.4
  "miniflare>undici": 7.30.1
  "undici@>=7 <7.30.1": 7.30.1
  "fast-uri": "3.1.9"
  "zod@>=4 <4.6.6": "4.6.6"
  "eslint-plugin-react-hooks>zod": "4.6.6"
  "@esbuild-kit/core-utils>esbuild": 0.25.12
  sharp: 0.35.5
  "@next/eslint-plugin-next>fast-glob": npm:tinyglobby@0.2.15
  source-map-js: 1.2.2
  "minimatch@<11.0.1": 11.0.1

# User-approved exceptions for these exact security releases.
minimumReleaseAgeExclude:
  # Official Next.js v16.4.5 security release. Registry integrity and provenance verified.
  - '@next/env@16.4.5'
  - '@next/eslint-plugin-next@16.4.5'
  - '@next/swc-darwin-arm64@16.4.5'
  - '@next/swc-darwin-x64@16.4.5'
  - '@next/swc-linux-arm64-gnu@16.4.5'
  - '@next/swc-linux-arm64-musl@16.4.5'
  - '@next/swc-linux-x64-gnu@16.4.5'
  - '@next/swc-linux-x64-musl@16.4.5'
  - '@next/swc-win32-arm64-msvc@16.4.5'
  - '@next/swc-win32-x64-msvc@16.4.5'
  - 'eslint-config-next@16.4.5'
  - 'next@16.4.5'
  - source-map-js@1.2.2
  - minimatch@11.0.1

# Keep legacy ESLint consumers compatible with minimatch's named exports.
patchedDependencies:
  minimatch@11.0.1: patches/minimatch@11.0.1.patch
