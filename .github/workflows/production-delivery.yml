name: Production delivery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stage_prebuilt:
        description: Stage and verify a GitHub-built artifact without changing production domains
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-secret-delivery
  cancel-in-progress: false

jobs:
  secrets:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.repository.id == github.repository_id &&
        github.event.workflow_run.head_repository.id == github.repository_id))
    name: Check committed secrets before production delivery
    uses: ./.github/workflows/secret-scanning.yml

  deliver:
    needs: secrets
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.repository.id == github.repository_id &&
        github.event.workflow_run.head_repository.id == github.repository_id))
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: tsilva/.github/.github/workflows/production-delivery.yml@a20dac1368cedf94bf81e0af5eb38f844a924240
    with:
      sync_only: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  publish:
    needs: deliver
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.repository.id == github.repository_id &&
        github.event.workflow_run.head_repository.id == github.repository_id))
    uses: tsilva/.github/.github/workflows/vercel-prebuilt.yml@e11e1d0beb80276055c14630c2bc1e9515a94eaa
    with:
      project_id: prj_stGKNmevpjNfWlCMH8vS1Y3prnFM
      project_name: paperclean-web
      production_domains: '["paperclean.tsilva.eu","paperclean-web.vercel.app"]'
      public_environment: '["NEXT_PUBLIC_APP_URL","NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY","NEXT_PUBLIC_GA_MEASUREMENT_ID","NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"]'
      promote: ${{ !inputs.stage_prebuilt }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
