[project]
name = "paperclean-processor"
version = "0.1.0"
description = "Ephemeral HTTP wrapper for PaperClean Cloudflare Containers"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28.1",
  "numpy>=2.2",
  "opencv-python-headless>=4.11",
  "pikepdf>=10.0",
  "pillow>=11.2",
  "pypdfium2>=4.30",
  "rich>=15,<16",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<0.17",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
